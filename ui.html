<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>IScriptインタプリタv1.0.0f for Firefox</title>
  <style>
body{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;width:360px;max-width:400px;margin:3px auto;padding:20px;background-color:#f0f2f5;color:#333;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)}#meta{font-size:13px;background:#fff;padding:12px 16px;border-radius:8px;margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,.05)}#meta div{margin-bottom:6px}#meta b{color:#555}#file{width:100%;padding:8px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;margin-bottom:12px;transition:border-color 0.2s}#file:hover{border-color:#007bff}button{padding:10px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:500;transition:background 0.2s,transform 0.1s;margin-right:10px}#run{background-color:#007bff;color:#fff}#run:hover{background-color:#0056b3;transform:translateY(-1px)}#stop{background-color:#dc3545;color:#fff}#stop:hover{background-color:#a71d2a;transform:translateY(-1px)}#ret{font-weight:700;margin-left:6px}pre{background:#1e1e1e;color:#f8f8f2;padding:12px;border-radius:8px;height:120px;overflow-y:auto;font-family:'Courier New',monospace;margin-top:12px;white-space:pre-wrap;word-wrap:break-word}
  </style>
</head>
<body>
  <h1>IScriptインタプリタ v1.0.0f</h1>
  <div id="meta">
    <div><b>題名:</b> <span id="meta-title">-</span></div>
    <div><b>紹介:</b> <span id="meta-desc">-</span></div>
    <div><b>作者:</b> <span id="meta-author">-</span></div>
    <div><b>要求仕様Ver:</b> <span id="meta-ver">-</span></div>
    <div><small>※このインタプリタはisc1.0の仕様に互換しています。</small></div>
  </div>
  <input type="file" id="file" accept=".isc"><br>
  <button id="run">スクリプト実行</button>
  <button id="stop">停止</button>
  <div style="margin-top:12px;">戻り値: <span id="ret">-</span></div>
  <pre id="log">ログが表示されます</pre>
  <script src="interpreter.js"></script>
  <script src="ui.js"></script>
</body>
</html>
